<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة القيادات الشبابية</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.img-wrap{position:relative; margin-bottom:10px;}
.img-wrap img{width:100%; height:300px; object-fit:cover; border-radius:16px; border:2px solid #ddd; display:block;}
.del-btn{position:absolute; top:8px; left:8px; background:#dc2626; color:white; border:none; padding:6px 14px; border-radius:20px; font-weight:900; cursor:pointer; font-size:14px;}
</style>
</head>
<body class="bg-gray-50">

<img src="banner.jpg" style="width:100%; display:block;">
<div class="bg-green-800 text-white text-center py-3">
<h1 class="text-xl font-black">مؤسسة القيادات الشبابية لتنمية المجتمع</h1>
<p class="text-xs">المشهرة برقم 1833 لسنة 2026 - إدفو</p>
</div>

<!-- القافلة الطبية -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:2px solid #1e3a8a;">
<h2 style="text-align:center; background:#1e3a8a; color:white; padding:12px; border-radius:12px; font-weight:900;">القافلة الطبية</h2>
<div class="text-center mt-3"><label for="qafilaUpload" style="background:#1e3a8a; color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block;">+ اضف صور القافلة</label><input type="file" id="qafilaUpload" multiple accept="image/*" style="display:none;"></div>
<div id="qafilaGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;"></div>
</div>

<!-- الوعي نور -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:2px solid #b91c1c;">
<h2 style="text-align:center; background:#b91c1c; color:white; padding:12px; border-radius:12px; font-weight:900;">الوعي نور</h2>
<div class="text-center mt-3"><label for="waeyUpload" style="background:#b91c1c; color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block;">+ اضف صور الوعي نور</label><input type="file" id="waeyUpload" multiple accept="image/*" style="display:none;"></div>
<div id="waeyGrid" style="display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px;"></div>
</div>

<!-- مبادرة العلم نور -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:2px solid #065f46;">
<h2 style="text-align:center; background:#065f46; color:white; padding:12px; border-radius:12px; font-weight:900;">مبادرة العلم نور</h2>
<div class="text-center mt-3"><label for="elmUpload" style="background:#065f46; color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block;">+ اضف صور العلم نور</label><input type="file" id="elmUpload" multiple accept="image/*" style="display:none;"></div>
<div id="elmGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;"></div>
</div>

<!-- شبابنا قوتنا -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:2px solid #000;">
<h2 style="text-align:center; background:#000; color:#fbbf24; padding:12px; border-radius:12px; font-weight:900;">شبابنا قوتنا</h2>
<div class="text-center mt-3"><label for="shababUpload" style="background:#000; color:#fbbf24; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block;">+ اضف صور شبابنا قوتنا</label><input type="file" id="shababUpload" multiple accept="image/*" style="display:none;"></div>
<div id="shababGrid" style="display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px;"></div>
</div>

<!-- التمريض المنزلي -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:2px solid #1e3a8a;">
<h2 style="text-align:center; background:#1e3a8a; color:white; padding:12px; border-radius:12px; font-weight:900;">🏥 التمريض المنزلي</h2>
<div class="text-center mt-3"><label for="tamreedUpload" style="background:#1e3a8a; color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block;">+ اضف صور التمريض</label><input type="file" id="tamreedUpload" multiple accept="image/*" style="display:none;"></div>
<div id="tamreedGrid" style="display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px;"></div>
</div>

<!-- حفظة كتاب الله -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:2px solid #065f46;">
<h2 style="text-align:center; background:#065f46; color:white; padding:12px; border-radius:12px; font-weight:900;">📖 حفظة كتاب الله</h2>
<div class="text-center mt-3"><label for="huffazUpload" style="background:#065f46; color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block;">+ اضف صور حفظة كتاب الله</label><input type="file" id="huffazUpload" multiple accept="image/*" style="display:none;"></div>
<div id="huffazGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;"></div>
</div>

<!-- انتصارات اكتوبر - قسم جديد -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:3px solid #b91c1c;">
<h2 style="text-align:center; background:linear-gradient(90deg,#000,#b91c1c,#000); color:white; padding:14px; border-radius:12px; font-weight:900; font-size:20px;">🇪🇬 انتصارات اكتوبر</h2>
<div class="text-center mt-3"><label for="octoberUpload" style="background:#b91c1c; color:white; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block;">+ اضف صور انتصارات اكتوبر</label><input type="file" id="octoberUpload" multiple accept="image/*" style="display:none;"></div>
<div id="octoberGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;"></div>
</div>

<!-- ضيوف الرحمن - قسم جديد -->
<div style="margin:15px 10px; background:#fff; border-radius:18px; padding:12px; border:3px solid #000;">
<h2 style="text-align:center; background:#000; color:#fbbf24; padding:14px; border-radius:12px; font-weight:900; font-size:20px;">🕋 ضيوف الرحمن - الحج والعمرة</h2>
<div class="text-center mt-3"><label for="hajjUpload" style="background:#000; color:#fbbf24; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:900; display:inline-block; border:1px solid #fbbf24;">+ اضف صور ضيوف الرحمن</label><input type="file" id="hajjUpload" multiple accept="image/*" style="display:none;"></div>
<div id="hajjGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;"></div>
</div>

<footer class="bg-green-900 text-white text-center py-4 text-sm mt-4">© مؤسسة القيادات الشبابية - إدفو</footer>

<script>
function setupUploader(inputId, gridId){
  const input = document.getElementById(inputId);
  const grid = document.getElementById(gridId);
  input.addEventListener('change', function(e){
    for(let file of e.target.files){
      const reader = new FileReader();
      reader.onload = function(ev){
        const wrap = document.createElement('div');
        wrap.className = "img-wrap";
        const img = document.createElement('img');
        img.src = ev.target.result;
        const del = document.createElement('button');
        del.className = "del-btn";
        del.innerText = "✕ حذف";
        del.onclick = function(){ if(confirm('تحذف الصورة؟')) wrap.remove(); };
        wrap.appendChild(img);
        wrap.appendChild(del);
        grid.appendChild(wrap);
      }
      reader.readAsDataURL(file);
    }
    input.value="";
  });
}
setupUploader('qafilaUpload','qafilaGrid');
setupUploader('waeyUpload','waeyGrid');
setupUploader('elmUpload','elmGrid');
setupUploader('shababUpload','shababGrid');
setupUploader('tamreedUpload','tamreedGrid');
setupUploader('huffazUpload','huffazGrid');
setupUploader('octoberUpload','octoberGrid');
setupUploader('hajjUpload','hajjGrid');
</script>

</body>
</html>
