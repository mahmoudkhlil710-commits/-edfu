<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة ادفو 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#eef5ef}
header{background:linear-gradient(135deg,#0f5c2e,#1a8a44);color:white;padding:35px 15px;text-align:center;border-radius:0 0 30px 30px;box-shadow:0 5px 20px rgba(0,0,0,.2)}
header h1{margin:0;font-size:32px}
header p{opacity:.9;margin:10px 0 0}
.container{max-width:900px;margin:-20px auto 30px;padding:0 15px}
.upload-card{background:white;padding:25px;border-radius:20px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.1)}
.upload-card h2{margin:0 0 15px;color:#0f5c2e}
.file-wrap{border:2px dashed #1a8a44;border-radius:15px;padding:20px;margin:15px 0;background:#f7fdf8}
input[type=file]{font-size:15px}
.btn{background:linear-gradient(135deg,#0f5c2e,#1a8a44);color:white;border:none;padding:14px 35px;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(26,138,68,.4)}
.btn:active{transform:scale(.97)}
#status{color:#0f5c2e;font-weight:bold;margin-top:15px;min-height:20px}
.gallery-title{text-align:center;color:#0f5c2e;margin:30px 0 15px;font-size:22px}
#gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
#gallery img{width:100%;height:180px;object-fit:cover;border-radius:18px;box-shadow:0 3px 12px rgba(0,0,0,.15);background:white}
@media(min-width:600px){ #gallery{grid-template-columns:repeat(3,1fr)} #gallery img{height:200px} }
footer{text-align:center;color:#888;padding:20px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🌿 مؤسسة ادفو 2026</h1>
<p>معرض صور المؤسسة - ارفع وشارك اجمل اللحظات</p>
</header>

<div class="container">
<div class="upload-card">
<h2>ارفع صور المؤسسة هنا</h2>
<div class="file-wrap">
<input type="file" id="fileInput" accept="image/*">
</div>
<button class="btn" id="uploadBtn">📸 رفع الصورة</button>
<p id="status"></p>
</div>

<h3 class="gallery-title">📷 صور المؤسسة</h3>
<div id="gallery"></div>
</div>

<footer>مؤسسة ادفو 2026 - جميع الحقوق محفوظة</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAuIh2OMchkJyGfJg5bf7qOG8_qq_fpRR4",
  authDomain: "edfu-muasasa-2026-f5505.firebaseapp.com",
  projectId: "edfu-muasasa-2026-f5505",
  storageBucket: "edfu-muasasa-2026-f5505.firebasestorage.app",
  messagingSenderId: "654252383649",
  appId: "1:654252383649:web:2165cc2db078dcf0cf7fe0"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const status = document.getElementById('status');
const gallery = document.getElementById('gallery');

async function loadImages(){
  gallery.innerHTML = "";
  try{
    const listRef = ref(storage, 'images');
    const res = await listAll(listRef);
    for(const item of res.items){
      const url = await getDownloadURL(item);
      const img = document.createElement('img');
      img.src = url;
      gallery.appendChild(img);
    }
    if(res.items.length === 0){ gallery.innerHTML = "<p style='grid-column:1/-1;text-align:center;color:#888'>لسه مفيش صور، ارفع اول صورة</p>"; }
  }catch(e){ console.log(e); }
}

uploadBtn.onclick = async () => {
  const file = fileInput.files[0];
  if(!file){ status.textContent = "اختار صورة الاول"; return; }
  status.textContent = "جاري الرفع... استنى";
  try{
    const name = Date.now() + "_" + file.name;
    const storageRef = ref(storage, 'images/' + name);
    await uploadBytes(storageRef, file);
    status.textContent = "تم الرفع بنجاح ✅";
    fileInput.value = "";
    loadImages();
  }catch(e){
    status.textContent = "في مشكلة في الرفع، اتأكد ان القواعد مفتوحة";
    console.log(e);
  }
};
loadImages();
</script>
</body>
</html>
