<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>يوم اليتيم - مؤسسة القيادات الشبابية - إدفو</title>
<style>
body{margin:0;font-family:Tahoma;background:#f4f6f9}
.header{background:#0a2e5a;color:#ffcc00;text-align:center;padding:30px;border-bottom:5px solid #ffcc00}
.header h1{margin:0;font-size:24px}
.container{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:700px){.container{grid-template-columns:1fr}}
.box{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,0.2);border:2px solid #ffcc00}
.box img{width:100%;height:300px;object-fit:cover;display:block}
.box .name{background:#0a2e5a;color:#ffcc00;text-align:center;padding:12px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="header">

</div>
