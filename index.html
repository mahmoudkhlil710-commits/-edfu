*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f5f5f5}
.top{background:#0a5c36;color:#fff;padding:10px;text-align:center}

</head>
<body>

<div class="top"><a href="https://wa.me/201150844699">التواصل عبر واتساب 01150844699 💬</a></div>

<div class="header"><img src="banner.jpg" style="width:100%;border-radius:10px;">

<div class="admin-box" id="loginBox">

<div class="admin-box" id="logoutBox" style="display:none">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

<script>
const firebaseConfig = {
      
  apiKey: "AIzaSyAuIh2OMchkJyGfJg5bf7qOG8_qq_fpRR4",
  authDomain: "edfu-muasasa-2026-f5505.firebaseapp.com",
  databaseURL: "https://edfu-muasasa-2026-f5505-default-rtdb.firebaseio.com",
  projectId: "edfu-muasasa-2026-f5505",
  storageBucket: "edfu-muasasa-2026-f5505.firebasestorage.app",
  messagingSenderId: "654252383649",
  appId: "1:654252383649:web:2165cc2db078dcf0cf7fe0",
  measurementId: "G-FJ4KVVWG73"
};
firebase.initializeApp(firebaseConfig);
const storage = firebase.storage();
const db = firebase.database();

const ADMIN_PASS = "2026";
let isAdmin = false;
const cats = ["القافلة الطبية","الوعي نور","تنمية المجتمع","مبادرات شبابية","حملات التوعية","الأنشطة والفعاليات","خدمات المجتمع"];

function login(){
  if(document.getElementById('pass').value === ADMIN_PASS){
    isAdmin = true;
    document.getElementById('loginBox').style.display='none';
    document.getElementById('logoutBox').style.display='block';
    render();
  } else { alert('كلمة السر غلط'); }
}
function logout(){ isAdmin=false; location.reload(); }

// --- ده الجديد: ضغط الصورة قبل الرفع ---
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const max = 1000;
        if(w > max){ h = h * max / w; w = max; }
        if(h > max){ w = w * max / h; h = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob((blob)=>{ resolve(blob); }, 'image/jpeg', 0.7);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}


async function upload(cat){
const input = document.createElement('input');
input.type='file'; input.accept='image/*';
input.onchange = async ()=>{
const file = input.files[0];
if(!file) return;
document.getElementById('status').innerText = 'جاري ضغط ورفع الصورة...';
const compressed = await compressImage(file);
const dataUrl = await new Promise(function(resolve){
const r = new FileReader();
r.onload = function(){ resolve(r.result); };
r.readAsDataURL(compressed);
});
await db.ref('images/'+cat).push(dataUrl);
document.getElementById('status').innerText = 'تم الرفع بنجاح ✅';
setTimeout(()=>{ document.getElementById('status').innerText = ''; }, 3000);
};
input.click();
}

function delImg(cat, key, url){
if(!confirm('تحذف الصورة دي؟')) return;
db.ref('images/'+cat+'/'+key).remove();
}
function render(){
  const box = document.getElementById('sections');
  box.innerHTML='';
  cats.forEach(cat=>{
    const div = document.createElement('div');
    div.className='section';
    div.innerHTML = `<h2>${cat}</h2>${isAdmin?`<button class="add-btn" onclick="upload('${cat}')">+ اضف صور ${cat}</button>`:''}<div class="gallery" id="g-${cat}"></div>`;
    box.appendChild(div);
    db.ref('images/'+cat).on('value', snap=>{
      const g = document.getElementById('g-'+cat);
      if(!g) return;
      g.innerHTML='';
      snap.forEach(child=>{
        const url = child.val();
        g.innerHTML += `<div class="img-wrap"><img src="${url}">${isAdmin?`<button class="del" onclick="delImg('${cat}','${child.key}')">✕</button>`:''}</div>`;
      });
    });
  });
}
render();
</script>
</body>
</html>
