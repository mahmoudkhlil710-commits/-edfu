<script>
function setupUploader(inputId, gridId){
  const input = document.getElementById(inputId);
  const grid = document.getElementById(gridId);
  input.addEventListener('change', function(e){
    for(let file of e.target.files){
      const reader = new FileReader();
      reader.onload = function(ev){
        const img = document.createElement('img');
        img.src = ev.target.result;
        img.style = "width:100%; border-radius:15px; object-fit:cover;";
        if(gridId==='qafilaGrid') img.style.height='220px';
        if(gridId==='huffazGrid') { img.style.height='280px'; img.style.border='2px solid #065f46'; }
        grid.appendChild(img);
      }
      reader.readAsDataURL(file);
    }
  });
}
setupUploader('qafilaUpload','qafilaGrid');
setupUploader('waeyUpload','waeyGrid');
setupUploader('elmUpload','elmGrid');
setupUploader('shababUpload','shababGrid');
setupUploader('tamreedUpload','tamreedGrid');
setupUploader('huffazUpload','huffazGrid');
</script>
