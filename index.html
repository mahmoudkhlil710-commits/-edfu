<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة القيادات الشبابية - إدفو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{background:#f2f2f2;color:#222}
header{background:#0b3d2e;color:#fff;padding:20px 14px;text-align:center}
header h1{font-size:25px;margin-bottom:6px}
header p{font-size:14px;opacity:.9}
.banner{background:#f5c518;color:#000;text-align:center;padding:11px;font-weight:bold;font-size:15px}
.banner img{width:100%;max-height:220px;object-fit:cover;display:block;margin-top:10px;border-radius:10px}
.topbar{display:flex;justify-content:center;gap:10px;padding:12px;background:#fff;flex-wrap:wrap}
button{border:0;padding:11px 18px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
.btn-admin{background:#0b3d2e;color:#fff}
.btn-add{background:#f5c518;color:#000}
.container{max-width:1000px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover;display:block}
.card .cap{padding:8px;font-size:13px;text-align:center}
.card .del{display:none;background:#c00;color:#fff;width:100%;padding:8px}
body.admin .card .del{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:14px}
.modal.open{display:flex}
.box{background:#fff;width:100%;max-width:400px;padding:18px;border-radius:14px}
.box h3{margin-bottom:12px;text-align:center}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;font-size:15px}
.hidden{display:none}
footer{text-align:center;padding:20px;font-size:13px;color:#666}
</style>
</head>
<body>

<header>
<h1>مؤسسة القيادات الشبابية</h1>
<p>فرع إدفو - أسوان</p>
</header>

<div class="banner">
المشهرة برقم 1833 لسنة 2026
<img src="banner.jpg" onerror="this.style.display='none'">
</div>

<div class="topbar">
<button class="btn-admin" onclick="openLogin()">دخول الأدمن</button>
<button class="btn-add hidden" id="addBtn" onclick="openAdd()">+ إضافة صورة</button>
<button class="btn-admin hidden" id="logoutBtn" onclick="logout()">خروج</button>
</div>

<div class="container">
<div class="grid" id="gallery"></div>
</div>

<div class="modal" id="loginModal">
<div class="box">
<h3>دخول الأدمن</h3>
<input type="password" id="pass" placeholder="اكتب كلمة السر">
<button class="btn-admin" style="width:100%" onclick="login()">دخول</button>
<button style="width:100%;background:#eee;margin-top:8px" onclick="closeAll()">إلغاء</button>
<p id="err" style="color:red;text-align:center;margin-top:8px"></p>
</div>
</div>

<div class="modal" id="addModal">
<div class="box">
<h3>إضافة صورة</h3>
<input type="text" id="imgTitle" placeholder="عنوان الصورة">
<input type="text" id="imgUrl" placeholder="اسم الصورة - مثال: IMG-20261101-WA0050.jpg">
<p style="font-size:12px;color:#666;text-align:center">اكتب اسم الصورة اللي رفعتها في نفس الريبو</p>
<button class="btn-add" style="width:100%" onclick="addImage()">إضافة</button>
<button style="width:100%;background:#eee;margin-top:8px" onclick="closeAll()">إلغاء</button>
</div>
</div>

<footer>مؤسسة القيادات الشبابية - إدفو © 2026</footer>

<script>
const PASSWORD = "edfu123";
// صورك القديمة اللي موجودة في الريبو
let defaultImages = [
"IMG-20261101-WA0023.jpg","IMG-20261101-WA0024.jpg","IMG-20261101-WA0025.jpg","IMG-20261101-WA0026.jpg","IMG-20261101-WA0028.jpg","IMG-20261101-WA0029.jpg","IMG-20261101-WA0030.jpg","IMG-20261101-WA0031.jpg","IMG-20261101-WA0033.jpg","IMG-20261101-WA0034.jpg","IMG-20261101-WA0035.jpg","IMG-20261101-WA0036.jpg","IMG-20261101-WA0037.jpg","IMG-20261101-WA0042.jpg","IMG-20261101-WA0043.jpg","IMG-20261101-WA0044.jpg","IMG-20261101-WA0045.jpg","IMG-20261101-WA0046.jpg","IMG-20261101-WA0047.jpg","IMG-20261101-WA0048.jpg","IMG-20261101-WA0049.jpg","IMG-20261101-WA0050.jpg","IMG-20261101-WA0051.jpg","IMG-20261101-WA0052.jpg","IMG-20261101-WA0053.jpg","IMG-20261101-WA0054.jpg","IMG-20261101-WA0055.jpg","IMG-20261101-WA0056.jpg"
].map(u=>({title:"مؤسسة القيادات الشبابية - إدفو", url:u}));

let images = JSON.parse(localStorage.getItem("edfu_images") || "null") || defaultImages;
let isAdmin = localStorage.getItem("edfu_admin") === "1";

function render(){
  const g = document.getElementById("gallery");
  g.innerHTML = "";
  images.forEach((it,i)=>{
    const d = document.createElement("div");
    d.className="card";
    d.innerHTML = `<img src="${it.url}" onerror="this.parentElement.style.display='none'"><div class="cap">${it.title}</div><button class="del" onclick="delImg(${i})">حذف</button>`;
    g.appendChild(d);
  });
  document.body.classList.toggle("admin", isAdmin);
  document.getElementById("addBtn").classList.toggle("hidden", !isAdmin);
  document.getElementById("logoutBtn").classList.toggle("hidden", !isAdmin);
}
function openLogin(){ document.getElementById("loginModal").classList.add("open"); }
function openAdd(){ document.getElementById("addModal").classList.add("open"); }
function closeAll(){ document.querySelectorAll(".modal").forEach(m=>m.classList.remove("open")); }
function login(){
  const p = document.getElementById("pass").value.trim();
  if(p === PASSWORD){
    isAdmin = true; localStorage.setItem("edfu_admin","1");
    closeAll(); render();
  } else { document.getElementById("err").innerText = "كلمة السر غلط"; }
}
function logout(){ isAdmin=false; localStorage.removeItem("edfu_admin"); render(); }
function addImage(){
  const title = document.getElementById("imgTitle").value.trim() || "صورة جديدة";
  const url = document.getElementById("imgUrl").value.trim();
  if(!url){ alert("اكتب اسم الصورة"); return; }
  images.unshift({title, url});
  localStorage.setItem("edfu_images", JSON.stringify(images));
  document.getElementById("imgTitle").value=""; document.getElementById("imgUrl").value="";
  closeAll(); render();
}
function delImg(i){
  if(!confirm("تحذف الصورة دي؟")) return;
  images.splice(i,1);
  localStorage.setItem("edfu_images", JSON.stringify(images));
  render();
}
render();
</script>
</body>
</html>
