<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة ادفو 2026</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;text-align:center;padding:20px}
h1{color:#1a5c2a}
.box{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 2px 10px rgba(0,0,0,.1)}
button{background:#1a5c2a;color:white;border:none;padding:12px 25px;border-radius:10px;font-size:16px;cursor:pointer;margin:10px}
input{margin:15px}
#gallery{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
#gallery img{width:150px;height:150px;object-fit:cover;border-radius:10px}
#status{color:#1a5c2a;margin:10px}
</style>
</head>
<body>
<h1>مؤسسة ادفو 2026</h1>
<div class="box">
<p>ارفع صور المؤسسة هنا</p>
<input type="file" id="fileInput" accept="image/*">
<br>
<button id="uploadBtn">رفع الصورة</button>
<p id="status"></p>
</div>
<div id="gallery"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAuIh2OMchkJyGfJg5bf7qOG8_qq_fpRR4",
  authDomain: "edfu-muasasa-2026-f5505.firebaseapp.com",
  projectId: "edfu-muasasa-2026-f5505",
  storageBucket: "edfu-muasasa-2026-f5505.firebasestorage.app",
  messagingSenderId: "654252383649",
  appId: "1:654252383649:web:2165cc2db078dcf0cf7fe0"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);

const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const status = document.getElementById('status');
const gallery = document.getElementById('gallery');

async function loadImages(){
  gallery.innerHTML = "";
  try{
    const listRef = ref(storage, 'images');
    const res = await listAll(listRef);
    for(const item of res.items){
      const url = await getDownloadURL(item);
      const img = document.createElement('img');
      img.src = url;
      gallery.appendChild(img);
    }
  }catch(e){ console.log(e); }
}

uploadBtn.onclick = async () => {
  const file = fileInput.files[0];
  if(!file){ status.textContent = "اختار صورة الاول"; return; }
  status.textContent = "جاري الرفع... استنى";
  try{
    const name = Date.now() + "_" + file.name;
    const storageRef = ref(storage, 'images/' + name);
    await uploadBytes(storageRef, file);
    status.textContent = "تم الرفع بنجاح ✅";
    fileInput.value = "";
    loadImages();
  }catch(e){
    status.textContent = "في مشكلة في الرفع، اتأكد ان القواعد مفتوحة";
    console.log(e);
  }
};

loadImages();
</script>
</body>
</html>
