<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدفو - معرض الصور</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,Tahoma,sans-serif;background:#f4f4f4;margin:0}
header{background:#0b6e4f;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:24px}
.wrap{max-width:1000px;margin:auto;padding:15px}
.topbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.topbar button{border:0;padding:9px 14px;border-radius:20px;background:#fff;cursor:pointer}
.topbar button.active{background:#0b6e4f;color:#fff}
#loginBox,#adminBox{background:#fff;padding:15px;border-radius:12px;margin:12px 0}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:16px}
.btn{background:#0b6e4f;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;font-size:16px;cursor:pointer}
.btn2{background:#c0392b;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:160px;object-fit:cover;display:block}
.card .info{padding:10px}
.card .info b{display:block;font-size:14px}
.card .info span{font-size:12px;color:#777}
</style>
</head>
<body>
<header><h1>إدفو</h1><p>معرض صور المجتمع والمبادرات</p></header>
<div class="wrap">
<div class="topbar" id="cats"></div>
<div id="loginBox">
<h3 style="margin:0 0 5px">دخول الأدمن</h3>
<input id="pass" type="password" placeholder="اكتب كلمة السر">
<button class="btn" onclick="login()">دخول</button>
</div>
<div id="adminBox" style="display:none">
<h3 style="margin:0">لوحة التحكم - أهلا بيك يا أدمن</h3>
<input id="title" placeholder="عنوان الصورة">
<select id="cat">
<option>المجتمع</option>
<option>مبادرات شبابية</option>
<option>حملات توعية</option>
<option>الاحتفالات والفعاليات</option>
<option>كفاءات</option>
<option>خدمات</option>
</select>
<input id="file" type="file" accept="image/*">
<button class="btn" onclick="uploadImage()">رفع الصورة على ImgBB</button>
<p id="status" style="text-align:center;color:#0b6e4f"></p>
<button class="btn" style="background:#777;margin-top:8px" onclick="logout()">تسجيل خروج</button>
</div>
<div id="gallery" class="grid"></div>
<p id="empty" style="text-align:center;color:#888;display:none">لسه مفيش صور في القسم ده</p>
</div>
<script>
const ADMIN_PASS = "2026";
const IMGBB_KEY = "580eed74869803c869569f7f3ea10fbe";
let isAdmin = false;
let currentCat = "الكل";
let images = JSON.parse(localStorage.getItem("edfu_images") || "[]");
const allCats = ["الكل","المجتمع","مبادرات شبابية","حملات توعية","الاحتفالات والفعاليات","كفاءات","خدمات"];
function renderCats(){
  document.getElementById("cats").innerHTML = allCats.map(c=>`<button class="${c===currentCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){ currentCat=c; renderCats(); render(); }
function login(){
  let v = document.getElementById("pass").value.trim();
  v = v.replace(/[٠-٩]/g, d=>"0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)]);
  if(v === ADMIN_PASS){
    isAdmin = true;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("adminBox").style.display="block";
    render();
  } else { alert("كلمة السر غلط"); }
}
function logout(){ isAdmin=false; location.reload(); }
function render(){
  let list = images.filter(x=> currentCat==="الكل" || x.cat===currentCat);
  document.getElementById("empty").style.display = list.length?"none":"block";
  document.getElementById("gallery").innerHTML = list.map((x)=>{
    let realIndex = images.indexOf(x);
    return `<div class="card"><img src="${x.src}"><div class="info"><b>${x.title||"بدون عنوان"}</b><span>${x.cat}</span>${isAdmin?`<br><button class="btn2" onclick="delImage(${realIndex})">حذف</button>`:""}</div></div>`;
  }).join("");
}
function delImage(i){
  if(!confirm("تحذف الصورة دي؟")) return;
  images.splice(i,1);
  localStorage.setItem("edfu_images", JSON.stringify(images));
  render();
}
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        const max = 1000;
        if(w > max){ h = h * max / w; w = max; }
        if(h > max){ w = w * max / h; h = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        canvas.toBlob((blob)=>{ resolve(blob); }, "image/jpeg", 0.7);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function blobToBase64(blob){
  return new Promise((resolve)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(",")[1]);
    r.readAsDataURL(blob);
  });
}
async function uploadImage(){
  let file = document.getElementById("file").files[0];
  let title = document.getElementById("title").value.trim();
  let cat = document.getElementById("cat").value;
  if(!file){ alert("اختار صورة الأول"); return; }
  document.getElementById("status").textContent = "جار الرفع على ImgBB ... استنى شوية";
  try{
    let blob = await compressImage(file);
    let base64 = await blobToBase64(blob);
    let form = new FormData();
    form.append("image", base64);
    let res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_KEY, {method:"POST", body:form});
    let data = await res.json();
    if(!data.success) throw new Error("فشل الرفع");
    let url = data.data.url;
    images.unshift({src:url, title:title, cat:cat});
    localStorage.setItem("edfu_images", JSON.stringify(images));
    document.getElementById("title").value="";
    document.getElementById("file").value="";
    document.getElementById("status").textContent = "اترفعت بنجاح على ImgBB ✅";
    render();
  }catch(e){
    document.getElementById("status").textContent = "حصل مشكلة في الرفع، جرب تاني";
    alert("مشكلة في الرفع: " + e.message);
  }
}
renderCats();
render();
</script>
</body>
</html>
