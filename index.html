<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة القيادات الشبابية - إدفو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{background:#f2f2f2;color:#222}
header{background:#0b3d2e;color:#fff;padding:20px 14px;text-align:center}
header h1{font-size:25px} header p{font-size:14px;opacity:.9}
.banner{background:#f5c518;color:#000;text-align:center;padding:11px;font-weight:bold}
.banner img{width:100%;max-height:230px;object-fit:cover;display:block;margin-top:10px;border-radius:10px}
.topbar{display:flex;justify-content:center;gap:10px;padding:12px;background:#fff;flex-wrap:wrap}
button{border:0;padding:11px 18px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
.btn-admin{background:#0b3d2e;color:#fff}
.container{max-width:1000px;margin:auto;padding:12px}
.section{background:#fff;border:2px solid #ddd;border-radius:16px;padding:12px;margin-bottom:14px}
.sec-title{padding:14px;border-radius:12px;color:#fff;text-align:center;font-size:19px;font-weight:bold;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card img{width:100%;height:150px;object-fit:cover;display:block}
.card .del{display:none;background:#c00;color:#fff;width:100%;padding:8px}
body.admin .card .del{display:block}
.addBtn{display:none;margin:10px auto 0;padding:10px 18px;border-radius:20px;color:#fff;font-weight:bold}
body.admin .addBtn{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:14px}
.modal.open{display:flex}
.box{background:#fff;width:100%;max-width:400px;padding:18px;border-radius:14px}
.box h3{margin-bottom:12px;text-align:center}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;font-size:15px}
.hidden{display:none}
footer{text-align:center;padding:20px;font-size:13px;color:#fff;background:#0b3d2e}
.empty{font-size:13px;color:#888;text-align:center;padding:10px}
#preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;display:none;margin-bottom:10px}
#status{text-align:center;font-size:13px;color:#0b3d2e;margin-top:8px}
</style>
</head>
<body>
<header><h1>مؤسسة القيادات الشبابية</h1><p>فرع إدفو - أسوان</p></header>
<div class="banner">المشهرة برقم 1833 لسنة 2026<img src="banner.jpg" onerror="this.style.display='none'"></div>
<div class="topbar">
<button class="btn-admin" onclick="openLogin()">دخول الأدمن</button>
<button class="btn-admin hidden" id="logoutBtn" onclick="logout()">خروج</button>
</div>
<div class="container" id="sections"></div>
<div class="modal" id="loginModal"><div class="box">
<h3>دخول الأدمن</h3>
<input type="password" id="pass" placeholder="اكتب كلمة السر">
<button class="btn-admin" style="width:100%" onclick="login()">دخول</button>
<button style="width:100%;background:#eee;margin-top:8px" onclick="closeAll()">إلغاء</button>
<p id="err" style="color:red;text-align:center;margin-top:8px"></p>
</div></div>
<div class="modal" id="addModal"><div class="box">
<h3 id="addTitle">إضافة صورة</h3>
<img id="preview">
<input type="text" id="imgTitle" placeholder="عنوان الصورة - اختياري">
<label style="display:block;background:#f5c518;padding:12px;text-align:center;border-radius:10px;font-weight:bold;margin-bottom:10px;cursor:pointer">📸 اختار صورة من موبايلك<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewFile()"></label>
<p style="font-size:12px;color:#666;text-align:center">الصورة بتترفع على ImageBB، واللينك بيتحفظ في Firebase</p>
<button class="btn-admin" style="width:100%" id="uploadBtn" onclick="addImage()">رفع الصورة</button>
<p id="status"></p>
<button style="width:100%;background:#eee;margin-top:8px" onclick="closeAll()">إلغاء</button>
</div></div>
<footer>© مؤسسة القيادات الشبابية - إدفو</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const PASSWORD = "edfu123";
const IMGBB_KEY = "580eed74869803c869569f7f3ea10fbe";

const firebaseConfig = {
  apiKey: "AIzaSyAuIh2OMchkJyGfJg5bf7qOG8_qq_fpRR4",
  authDomain: "edfu-muasasa-2026-f5505.firebaseapp.com",
  projectId: "edfu-muasasa-2026-f5505",
  storageBucket: "edfu-muasasa-2026-f5505.firebasestorage.app",
  messagingSenderId: "654252383649",
  appId: "1:654252383649:web:2165cc2db078dcf0cf7fe0",
  measurementId: "G-FJ4KVVWG73"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "sections", "main");

const SECTIONS = [
{id:"qafela", title:"القافلة الطبية", color:"#1e3a8a", border:"#1e3a8a"},
{id:"wa3y", title:"الوعي نور", color:"#c81e1e", border:"#c81e1e"},
{id:"elm", title:"مبادرة العلم نور", color:"#0f7a4a", border:"#0f7a4a"},
{id:"shabab", title:"شبابنا قوتنا", color:"#000", border:"#000"},
{id:"tamreed", title:"🏥 التمريض المنزلي", color:"#1e3a8a", border:"#1e3a8a"},
{id:"quran", title:"📖 حفظة كتاب الله", color:"#0f7a4a", border:"#0f7a4a"},
{id:"october", title:"🇪🇬 انتصارات اكتوبر", color:"#7a0000", border:"#c81e1e"},
{id:"doyouf", title:"🕋 ضيوف الرحمن", color:"#000", border:"#000"},
];

let defaultData = {};
SECTIONS.forEach(s=> defaultData[s.id]=[]);
defaultData["shabab"] = ["IMG-20261101-WA0023.jpg","IMG-20261101-WA0024.jpg","IMG-20261101-WA0025.jpg","IMG-20261101-WA0026.jpg","IMG-20261101-WA0028.jpg","IMG-20261101-WA0029.jpg","IMG-20261101-WA0030.jpg","IMG-20261101-WA0031.jpg","IMG-20261101-WA0033.jpg","IMG-20261101-WA0034.jpg","IMG-20261101-WA0035.jpg","IMG-20261101-WA0036.jpg","IMG-20261101-WA0037.jpg","IMG-20261101-WA0042.jpg","IMG-20261101-WA0043.jpg","IMG-20261101-WA0044.jpg","IMG-20261101-WA0045.jpg","IMG-20261101-WA0046.jpg","IMG-20261101-WA0047.jpg","IMG-20261101-WA0048.jpg","IMG-20261101-WA0049.jpg","IMG-20261101-WA0050.jpg","IMG-20261101-WA0051.jpg","IMG-20261101-WA0052.jpg","IMG-20261101-WA0053.jpg","IMG-20261101-WA0054.jpg","IMG-20261101-WA0055.jpg","IMG-20261101-WA0056.jpg"].map(u=>({title:"شبابنا قوتنا",url:u}));

let data = JSON.parse(JSON.stringify(defaultData));
let isAdmin = localStorage.getItem("edfu_admin")==="1";
let currentSec = null;
let selectedFile = null;

async function loadFromFirebase(){
  try{
    const snap = await getDoc(docRef);
    if(snap.exists() && snap.data().data){
      data = snap.data().data;
      // ادمج صور شبابنا القديمة لو مش موجودة
      if(!data.shabab || data.shabab.length===0) data.shabab = defaultData.shabab;
    } else {
      // اول مرة - احفظ الافتراضي
      await setDoc(docRef, {data});
    }
  }catch(e){ console.log("Firebase load error", e); }
  render();
}
async function saveToFirebase(){
  try{ await setDoc(docRef, {data}); }catch(e){ alert("مشكلة في الحفظ في Firebase - اتأكد انك عملت القواعد اللي تحت"); console.log(e); }
}

function render(){
  const wrap = document.getElementById("sections"); wrap.innerHTML="";
  SECTIONS.forEach(s=>{
    const div=document.createElement("div"); div.className="section"; div.style.borderColor=s.border;
    let imgs = data[s.id]||[];
    let gridHtml = imgs.length===0 ? `<div class="empty">لسه مفيش صور في القسم ده</div>` : imgs.map((it,i)=>`<div class="card"><img src="${it.url}" onerror="this.parentElement.style.display='none'"><button class="del" onclick="window.delImg('${s.id}',${i})">حذف</button></div>`).join("");
    div.innerHTML=`<div class="sec-title" style="background:${s.color}">${s.title}</div><div class="grid">${gridHtml}</div><button class="addBtn" style="background:${s.color}" onclick="window.openAdd('${s.id}')">+ اضف صور ${s.title}</button>`;
    wrap.appendChild(div);
  });
  document.body.classList.toggle("admin", isAdmin);
  document.getElementById("logoutBtn").classList.toggle("hidden", !isAdmin);
}

window.openLogin = ()=> document.getElementById("loginModal").classList.add("open");
window.openAdd = (id)=>{ currentSec=id; selectedFile=null; document.getElementById("preview").style.display="none"; document.getElementById("fileInput").value=""; document.getElementById("status").innerText=""; document.getElementById("addTitle").innerText="إضافة صورة - "+SECTIONS.find(x=>x.id===id).title; document.getElementById("addModal").classList.add("open"); };
window.closeAll = ()=> document.querySelectorAll(".modal").forEach(m=>m.classList.remove("open"));
window.login = ()=>{ if(document.getElementById("pass").value.trim()===PASSWORD){isAdmin=true;localStorage.setItem("edfu_admin","1");window.closeAll();render();} else document.getElementById("err").innerText="كلمة السر غلط"; };
window.logout = ()=>{isAdmin=false;localStorage.removeItem("edfu_admin");render();};
window.previewFile = ()=>{
  const f = document.getElementById("fileInput").files[0]; if(!f) return;
  selectedFile = f;
  const reader = new FileReader();
  reader.onload = e=>{ const p=document.getElementById("preview"); p.src=e.target.result; p.style.display="block"; };
  reader.readAsDataURL(f);
};
window.addImage = async ()=>{
  if(!selectedFile){alert("اختار صورة الأول"); return;}
  const btn = document.getElementById("uploadBtn");
  const status = document.getElementById("status");
  btn.disabled = true; btn.innerText = "جاري الرفع على ImageBB..."; status.innerText = "استنى شوية، الصورة بتترفع...";
  try{
    const form = new FormData();
    form.append("image", selectedFile);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:"POST", body:form});
    const json = await res.json();
    if(!json.success) throw new Error("فشل الرفع");
    const imgUrl = json.data.url;
    const title = document.getElementById("imgTitle").value.trim() || "صورة";
    if(!data[currentSec]) data[currentSec]=[];
    data[currentSec].unshift({title, url: imgUrl});
    await saveToFirebase();
    status.innerText = "اترفعت بنجاح ✅";
    setTimeout(()=>{ document.getElementById("imgTitle").value=""; selectedFile=null; btn.disabled=false; btn.innerText="رفع الصورة"; window.closeAll(); render(); }, 800);
  }catch(e){
    alert("حصل مشكلة في الرفع، جرب تاني - اتأكد ان عندك نت وان قواعد Firestore مفتوحة");
    btn.disabled=false; btn.innerText="رفع الصورة"; status.innerText="";
  }
};
window.delImg = async (sec,i)=>{ if(!confirm("تحذف الصورة؟"))return; data[sec].splice(i,1); await saveToFirebase(); render(); };

loadFromFirebase();
</script><style>

</body>
