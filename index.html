<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مؤسسة القيادات الشبابية - إدفو</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial}
body{background:#fff}
.banner{width:100%;display:block}
.topbar{background:#0a5c36;color:#fff;text-align:center;padding:16px 10px}
.topbar h1{font-size:26px}
.topbar p{font-size:15px;opacity:.9;margin-top:4px}
.admin-btn{background:#fff;color:#0a5c36;border:none;padding:8px 18px;border-radius:50px;font-weight:800;margin-top:10px;cursor:pointer;font-size:15px}
.wrap{padding:14px}
.card{border:2.5px solid #ccc;border-radius:18px;padding:14px;margin-bottom:16px;background:#fff}
.card .title{border-radius:12px;padding:16px;text-align:center;color:#fff;font-size:24px;font-weight:800}
.card .add{display:none;width:fit-content;margin:14px auto 4px;padding:12px 22px;border-radius:50px;border:none;color:#fff;font-size:19px;font-weight:700;cursor:pointer}
body.admin .card .add{display:block}
.gallery{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.gallery img{width:31%;border-radius:10px;aspect-ratio:1/1;object-fit:cover}
.gallery .box{position:relative;width:31%}
.gallery .del{display:none;position:absolute;top:2px;left:2px;background:red;color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer}
body.admin .gallery .del{display:block}
.footer{background:#0a5c36;color:#fff;text-align:center;padding:16px}
input[type=file]{display:none}
.c1{border-color:#1a3a8a}.c1 .title,.c1 .add{background:#1e3a8a}
.c2{border-color:#c1272d}.c2 .title,.c2 .add{background:#c1272d}
.c3{border-color:#0a6b4a}.c3 .title,.c3 .add{background:#0a6b4a}
.c4{border-color:#000}.c4 .title,.c4 .add{background:#000;color:#f5c518}
.c5{border-color:#1e3a8a}.c5 .title,.c5 .add{background:#1e3a8a}
.c6{border-color:#0a6b4a}.c6 .title,.c6 .add{background:#0a6b4a}
.c7{border-color:#c1272d}.c7 .title{background:linear-gradient(#000,#c1272d)}.c7 .add{background:#c1272d}
.c8{border-color:#000}.c8 .title,.c8 .add{background:#000;color:#f5c518}
</style>
</head>
<body>
<img src="banner.jpg" class="banner">
<div class="topbar"><h1>مؤسسة القيادات الشبابية</h1><p>المشهرة برقم 1833 لسنة 2026 - إدفو</p><button class="admin-btn" id="adminBtn" onclick="adminLogin()">دخول الأدمن 🔐</button></div>
<div class="wrap" id="wrap"></div>
<div class="footer">© مؤسسة القيادات الشبابية - إدفو</div>
<script>
const DB="https://edfu-muasasa-2026-default-rtdb.firebaseio.com";
const IMGBB_KEY="580eed74869803c869569f7f3ea10fbe";
const ADMIN_PASS="edfu123";
const sections=[
{id:"qafila",name:"القافلة الطبية",cls:"c1",btn:"اضف صور القافلة +"},
{id:"waey",name:"الوعي نور",cls:"c2",btn:"اضف صور الوعي نور +"},
{id:"elm",name:"مبادرة العلم نور",cls:"c3",btn:"اضف صور العلم نور +"},
{id:"shabab",name:"شبابنا قوتنا",cls:"c4",btn:"اضف صور شبابنا قوتنا +"},
{id:"tamrid",name:"🏥 التمريض المنزلي",cls:"c5",btn:"اضف صور التمريض +"},
{id:"quran",name:"📖 حفظة كتاب الله",cls:"c6",btn:"اضف صور حفظة كتاب الله +"},
{id:"october",name:"🇪🇬 انتصارات اكتوبر",cls:"c7",btn:"اضف صور انتصارات اكتوبر +"},
{id:"hajj",name:"🕋 ضيوف الرحمن",cls:"c8",btn:"اضف صور ضيوف الرحمن +"},
];
if(localStorage.getItem('isAdmin')==='1'){document.body.classList.add('admin');document.getElementById('adminBtn').textContent='خروج الأدمن';}
function adminLogin(){
  if(document.body.classList.contains('admin')){
    document.body.classList.remove('admin');localStorage.removeItem('isAdmin');
    document.getElementById('adminBtn').textContent='دخول الأدمن 🔐';return;
  }
  let p=prompt('اكتب باسورد الأدمن:');
  if(p===ADMIN_PASS){document.body.classList.add('admin');localStorage.setItem('isAdmin','1');document.getElementById('adminBtn').textContent='خروج الأدمن';alert('أهلا بيك يا أدمن');}
  else if(p!==null){alert('الباسورد غلط');}
}
const wrap=document.getElementById('wrap');
sections.forEach(s=>{
  const d=document.createElement('div'); d.className='card '+s.cls;
  d.innerHTML=`<div class="title">${s.name}</div><button class="add" onclick="document.getElementById('f-${s.id}').click()">${s.btn}</button><input type="file" id="f-${s.id}" accept="image/*" multiple onchange="upload('${s.id}',this)"><div class="gallery" id="g-${s.id}"></div>`;
  wrap.appendChild(d);
});
async function load(){
  try{
    let r=await fetch(DB+'/photos.json'); let data=await r.json()||{};
    sections.forEach(s=>{
      let g=document.getElementById('g-'+s.id); g.innerHTML='';
      let items=data[s.id]||{};
      Object.entries(items).forEach(([k,v])=>{
        let url=typeof v==='string'?v:v.url;
        let box=document.createElement('div'); box.className='box';
        box.innerHTML=`<img src="${url}"><button class="del" onclick="delPhoto('${s.id}','${k}')">×</button>`;
        g.appendChild(box);
      });
    });
  }catch(e){}
}
async function upload(id,input){
  if(!document.body.classList.contains('admin')){alert('لازم تدخل كأدمن الأول');return;}
  if(!input.files.length) return;
  alert('جارى رفع الصور على ImageBB ... استنى شوية');
  for(let f of input.files){
    try{
      let form=new FormData(); form.append('image', f);
      let res=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:form});
      let j=await res.json();
      if(j.success){
        let url=j.data.url;
        await fetch(DB+'/photos/'+id+'.json',{method:'POST',body:JSON.stringify({url:url})});
      }
    }catch(e){}
  }
  input.value=''; alert('تم رفع الصور بنجاح'); load();
}
async function delPhoto(id,key){
  if(!document.body.classList.contains('admin')){alert('لازم تدخل كأدمن الأول');return;}
  if(!confirm('تحذف الصورة دي؟')) return;
  await fetch(DB+'/photos/'+id+'/'+key+'.json',{method:'DELETE'}); load();
}
load();
</script>
</body>
</html>
