};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);

function setup(inputId, statusId, galleryId, folder){
  const input = document.getElementById(inputId);
  const status = document.getElementById(statusId);
  const gallery = document.getElementById(galleryId);
  async function load(){
    gallery.innerHTML = "";
    try{
      const r = await listAll(ref(storage, folder));
      for(const item of r.items){
        const url = await getDownloadURL(item);
        const box = document.createElement('div');
        box.className = 'img-box';
        const img = document.createElement('img');
        img.src = url;
        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '✕';
        del.onclick = async () => {
          if(!confirm('تحذف الصورة دي؟')) return;
          try{ await deleteObject(item); load(); }catch(e){ alert('مش قادر احذف الصورة'); }
        };
        box.appendChild(img);
        box.appendChild(del);
        gallery.appendChild(box);
      }
    }catch(e){ console.log(e); }
  }
  input.onchange = async () => {
    const file = input.files[0];
    if(!file) return;
    status.textContent = "جاري الرفع... استنى";
    try{
      const name = Date.now() + "_" + file.name;
      await uploadBytes(ref(storage, folder + '/' + name), file);
      status.textContent = "تم الرفع بنجاح ✅";
      input.value = "";
      load();
    }catch(e){ status.textContent = "في مشكلة في الرفع"; }
  };
  load();
}
